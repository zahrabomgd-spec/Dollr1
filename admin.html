<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإعلانات - مفروشات المجد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style> * { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 sm:p-8">

    <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black text-amber-400">⚙️ لوحة تحكم الإعلانات</h1>
            <p class="text-xs text-slate-400">رفع الصور وتعديل الإعلان في تطبيق "الليرة اليوم" بضغطة زر</p>
        </div>

        <form id="adForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">عنوان الإعلان الرئيسي</label>
                <input type="text" id="adTitle" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm font-bold text-amber-300 focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">وصف الإعلان / التفاصيل</label>
                <textarea id="adDesc" rows="3" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-400"></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">رقم الواتساب للتواصل (بدون علامة +)</label>
                <input type="text" id="adPhone" placeholder="9639xxxxxxxx" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm font-bold text-emerald-400 focus:outline-none focus:border-emerald-500">
            </div>

            <hr class="border-slate-800 my-4">

            <div class="space-y-3">
                <label class="block text-xs font-bold text-amber-400">📁 اختر الصور من جهازك مباشرة (حتى 4 صور):</label>
                <input type="file" id="imgFiles" accept="image/*" multiple class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
                <p class="text-[10px] text-slate-400">ملاحظة: إذا لم تحدد صوراً جديدة، سيتم الاحتفاظ بالصور الحالية تلقائياً.</p>
            </div>

            <button type="submit" id="saveBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 px-4 rounded-xl transition duration-200 text-sm shadow-lg flex items-center justify-center gap-2 mt-6">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                حفظ ونشر التعديلات فوراً
            </button>
        </form>

        <div id="statusMsg" class="hidden text-center text-xs font-bold p-3 rounded-xl"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBdfuIlyVzoJFLLxmIXI5st5yPFkNelflY",
            authDomain: "dollr-ads.firebaseapp.com",
            databaseURL: "https://dollr-ads-default-rtdb.firebaseio.com",
            projectId: "dollr-ads",
            storageBucket: "dollr-ads.firebasestorage.app",
            messagingSenderId: "40676698727",
            appId: "1:40676698727:web:057713366fb99eb4dc02c2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentImages = [];

        // جلب البيانات الحالية
        db.ref('advertisement').once('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('adTitle').value = data.title || '';
                document.getElementById('adDesc').value = data.desc || '';
                document.getElementById('adPhone').value = data.phone || '';
                if(data.images) {
                    currentImages = data.images;
                }
            }
        });

        // دالة تحويل الصورة المرفوعة إلى Base64
        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // حفظ التعديلات
        document.getElementById('adForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "جاري معالجة وحفظ الصور...";

            const fileInput = document.getElementById('imgFiles');
            let imageBase64List = [];

            try {
                if (fileInput.files.length > 0) {
                    showStatus('جاري معالجة الصور المحددة...', 'bg-blue-500/20 text-blue-400');
                    for (let i = 0; i < Math.min(fileInput.files.length, 4); i++) {
                        const base64Str = await convertImageToBase64(fileInput.files[i]);
                        imageBase64List.push(base64Str);
                    }
                } else {
                    imageBase64List = currentImages;
                }

                const adData = {
                    title: document.getElementById('adTitle').value,
                    desc: document.getElementById('adDesc').value,
                    phone: document.getElementById('adPhone').value,
                    images: imageBase64List,
                    updatedAt: new Date().toISOString()
                };

                await db.ref('advertisement').set(adData);
                currentImages = imageBase64List;
                showStatus('تم حفظ ونشر التعديلات بنجاح في التطبيق!', 'bg-emerald-500/20 text-emerald-400');
            } catch (err) {
                showStatus('حدث خطأ أثناء الحفظ: ' + err.message, 'bg-rose-500/20 text-rose-400');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> حفظ ونشر التعديلات فوراً';
            }
        });

        function showStatus(msg, classes) {
            const status = document.getElementById('statusMsg');
            status.className = `text-center text-xs font-bold p-3 rounded-xl ${classes}`;
            status.innerText = msg;
            status.classList.remove('hidden');
        }
    </script>
</body>
</html>
